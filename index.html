<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Timer</title>
<style>
:root{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--acc:#3fb950}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
main{text-align:center;padding:24px}
.ring{position:relative;width:260px;height:260px;margin:24px auto}
svg{transform:rotate(-90deg)}
circle{fill:none;stroke-width:10}
.track{stroke:#21262d}
.bar{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:691.15;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
.time{position:absolute;inset:0;display:grid;place-items:center;font:700 52px ui-monospace,monospace}
button{background:#21262d;color:var(--fg);border:1px solid #30363d;border-radius:8px;padding:10px 18px;margin:4px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#04260f;border-color:var(--acc)}
p{color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>Focus Timer</h1>
  <div>
    <button data-m="focus" class="on">Focus 25</button>
    <button data-m="short">Short 5</button>
    <button data-m="long">Long 15</button>
  </div>
  <div class="ring">
    <svg width="260" height="260" viewBox="0 0 260 260">
      <circle class="track" cx="130" cy="130" r="110"/>
      <circle class="bar" id="bar" cx="130" cy="130" r="110"/>
    </svg>
    <div class="time" id="time">25:00</div>
  </div>
  <div>
    <button id="go">Start</button>
    <button id="reset">Reset</button>
  </div>
  <p>Sessions completed today: <b id="done">0</b> &middot; Space = start/pause</p>
</main>
<script>
const MIN = { focus: 25, short: 5, long: 15 };
const $ = (s) => document.querySelector(s);
const key = 'focus-' + new Date().toDateString();
let mode = 'focus', total = MIN.focus * 60, left = total, end = 0, timer = null, done = 0;
try { done = +localStorage.getItem(key) || 0; } catch (e) {}

function render() {
  const m = String(Math.floor(left / 60)).padStart(2, '0');
  const s = String(left % 60).padStart(2, '0');
  $('#time').textContent = m + ':' + s;
  $('#bar').style.strokeDashoffset = 691.15 * (1 - left / total);
  $('#done').textContent = done;
  document.title = m + ':' + s + ' - Focus Timer';
}
function beep() {
  try {
    const a = new AudioContext(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); o.stop(a.currentTime + 0.6);
  } catch (e) {}
}
function stop() { clearInterval(timer); timer = null; $('#go').textContent = 'Start'; }
function tick() {
  left = Math.max(0, Math.round((end - Date.now()) / 1000));
  if (left === 0) {
    stop(); beep();
    if (mode === 'focus') {
      done++;
      try { localStorage.setItem(key, done); } catch (e) {}
    }
  }
  render();
}
function toggle() {
  if (timer) { stop(); return; }
  if (left === 0) left = total;
  end = Date.now() + left * 1000;
  timer = setInterval(tick, 250);
  $('#go').textContent = 'Pause';
}
function setMode(m) {
  stop(); mode = m; total = left = MIN[m] * 60;
  document.querySelectorAll('[data-m]').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
  render();
}
document.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => setMode(b.dataset.m));
$('#go').onclick = toggle;
$('#reset').onclick = () => setMode(mode);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
});
render();
</script>
</body>
</html>
