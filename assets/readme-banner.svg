<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Focus Timer</title><desc id="d">A calm animated focus timer ring.</desc><defs><linearGradient id="bg"><stop stop-color="#17243b"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="ring"><stop stop-color="#62e3c1"/><stop offset="1" stop-color="#8fa8ff"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><circle cx="880" cy="150" r="92" fill="none" stroke="#293c55" stroke-width="14"/><circle cx="880" cy="150" r="92" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="150" transform="rotate(-90 880 150)"><animate attributeName="stroke-dashoffset" values="578;150;578" dur="12s" repeatCount="indefinite"/></circle><text x="880" y="160" text-anchor="middle" fill="#edf3ff" font-family="monospace" font-size="34">25:00</text><text x="80" y="135" fill="#edf3ff" font-family="Arial,sans-serif" font-size="54" font-weight="700">FOCUS TIMER</text><text x="84" y="180" fill="#91a0ba" font-family="monospace" font-size="16" letter-spacing="4">ONE TASK. ONE SESSION.</text><path d="M84 215H560" stroke="#62e3c1" stroke-width="3"><animate attributeName="stroke-dasharray" values="0 476;476 0" dur="4s" repeatCount="indefinite"/></path></svg>