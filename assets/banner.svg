<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="focus timer">
<style>
.bg{fill:#0d1117}
.t{font:700 38px system-ui,sans-serif;fill:#e6edf3}
.s{font:16px monospace;fill:#8b949e}
.track{fill:none;stroke:#21262d;stroke-width:10}
.bar{fill:none;stroke:#3fb950;stroke-width:10;stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;transform:rotate(-90deg);transform-origin:130px 100px;animation:ring 5s ease-in-out infinite}
.hand{stroke:#58a6ff;stroke-width:3;stroke-linecap:round;transform-origin:130px 100px;animation:spin 5s linear infinite}
@keyframes ring{0%{stroke-dashoffset:283}80%,100%{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<rect class="bg" width="800" height="200" rx="14"/>
<circle class="track" cx="130" cy="100" r="45"/>
<circle class="bar" cx="130" cy="100" r="45"/>
<line class="hand" x1="130" y1="100" x2="130" y2="68"/>
<circle cx="130" cy="100" r="4" fill="#e6edf3"/>
<text class="t" x="230" y="105">Focus Timer</text>
<text class="s" x="232" y="140">25 / 5 / 15 &#183; one file &#183; works offline</text>
</svg>
